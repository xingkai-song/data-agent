name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: 离线检查（不需要密钥）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent,server]"

      - name: 生成数仓
        # 数仓由固定随机种子的脚本生成，不入库；任何人跑出来的结果都一样
        run: python scripts/build_dataset.py

      - name: 单元测试
        run: python -m pytest tests/ -q

      - name: 评测门禁（离线层）
        # 评测集合法性 + 自检 100% + 负例 0%
        run: python eval/gate.py

  online:
    name: 在线评测（需要密钥，可选）
    runs-on: ubuntu-latest
    # 没有配置密钥时自动跳过，不会让 PR 变红
    if: ${{ github.event_name == 'push' && secrets.OPENAI_API_KEY != '' }}
    needs: offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent,server]"

      - name: 生成数仓
        run: python scripts/build_dataset.py

      - name: 评委校准
        # 校准没过说明评委本身不可信，后面的分数就不看了
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python eval/judge_runner.py --calibrate

      - name: 抽查评测质量
        # 抽样覆盖三个类别，任一指标低于阈值就失败
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python eval/gate.py --online --sample 12

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore
