name: Import repository bundle
on:
  push:
    paths:
      - '.github/workflows/import-bundle.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import repository source
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone data-agent.bundle /tmp/import
          cd /tmp/import
          git rm -r .github/workflows
          git -c user.name='xingkai-song' -c user.email='xingkai-song@users.noreply.github.com' commit -m 'Import repository source'
          git remote remove origin
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/source
