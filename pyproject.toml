[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "面向数据分析工作流的工具调用型 Agent + 评测平台"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "sqlglot>=25.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Agent 运行与可观测性依赖较重（会拉一堆传递依赖），
# 单独放一组，跑离线测试时不需要装
agent = [
    "langgraph",
    "openai>=1.0",
    "python-dotenv",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]
# 服务化
server = ["fastapi", "uvicorn", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
