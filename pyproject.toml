[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent"
version = "0.1.0"
description = "面向数据分析工作流的工具调用型 Agent + 评测平台"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "sqlglot>=25.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
