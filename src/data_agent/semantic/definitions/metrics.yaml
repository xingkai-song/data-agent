# 语义层 · 指标定义
#
# 指标分两类：
#   - 基础指标：definition 给出基础聚合片段，落在某一张表上
#   - 派生指标：expression 用其他指标名组合，SQL 由编译器生成
#
# 派生指标不写 SQL、不写 JOIN。归期过滤、join 路径、粒度对齐都由
# semantic/compiler.py 从表关系推导——同一个口径只写一次。
#
# alias 用于按用户口语检索指标（用户不会说 "net_gmv"，他会说"净销售额"）。

- name: gmv
  display_name: 成交总额
  description: 统计期内已支付订单的金额合计
  definition: SUM(orders.amount)
  base_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
    - orders.pay_time IS NOT NULL
  aliases: [GMV, 成交额, 销售额, 营业额, 交易额, 总成交]
  caveats:
    - 含已退款订单的金额。要看扣除退款后的口径请用 net_gmv
    - 必须按 pay_time 归期，不要用 create_time
  owner: 数据团队

- name: net_gmv
  display_name: 净成交额
  description: 成交总额扣除退款金额
  # 派生指标：业务关系写清楚即可。退款表通过 orders 关联，
  # 并按"所退订单的支付时间"归期（由 base_table/time_column 决定）。
  expression: "{gmv} - COALESCE({refund_amount}, 0)"
  base_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
    - orders.pay_time IS NOT NULL
  aliases: [净成交额, 净销售额, 扣除退款, 净额, 净GMV]
  caveats:
    - 这里的退款是按订单支付时间归期扣减（即退款计入其所退订单的支付期间）
    - 另一种常见口径是按 refund_time 归期扣减，两者结果不同。使用前必须先确认口径
  owner: 数据团队

- name: paid_order_count
  display_name: 已支付订单数
  description: 统计期内完成支付的订单数量
  definition: COUNT(DISTINCT orders.order_id)
  base_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
  aliases: [支付订单数, 成交单量, 订单量, 成交量]
  caveats:
    - 按 pay_time 归期。若要统计"下单量"应按 create_time 且不过滤状态
  owner: 数据团队

- name: order_count
  display_name: 下单量
  description: 统计期内创建的订单数量（含未支付）
  definition: COUNT(DISTINCT orders.order_id)
  base_table: orders
  time_column: create_time
  aliases: [下单量, 订单数, 下单数, 多少单, 订单量]
  caveats:
    - 按 create_time 归期，与成交类指标的归期字段不同。问"下了多少单"要用这个，不是 paid_order_count
    - 不按状态过滤，pending 和 cancelled 的订单也算
  owner: 数据团队

- name: aov
  display_name: 客单价
  description: 成交总额 ÷ 已支付订单数
  expression: "{gmv} / NULLIF({paid_order_count}, 0)"
  base_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
  aliases: [客单价, 平均订单金额, 单均金额]
  caveats:
    - 分母是订单数不是人数。若要按人计算应改为用户数并用 AVG
  owner: 数据团队

- name: item_amount
  display_name: 商品销售额
  description: 商品维度的成交金额（折扣后）
  definition: SUM(order_items.unit_price * order_items.quantity - order_items.discount)
  base_table: order_items
  time_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
    - orders.pay_time IS NOT NULL
  aliases: [商品销售额, 商品成交额, 单品销售额, 类目销售额, 品类销售额, 畅销商品, 热销商品, 卖得最好, 卖得最多, 商品排名, 商品排行]
  caveats:
    - 商品维度只能用明细表计算，因为 orders.amount 是订单级的
    - 订单级折扣已经分摊到每条明细的 discount 字段，因此要用 unit_price*quantity-discount，不能用 unit_price*quantity
    - 归期仍按 orders.pay_time，不要按明细表自身的字段
  owner: 数据团队

- name: refund_amount
  display_name: 退款金额
  description: 统计期内发生的退款金额
  definition: SUM(refunds.refund_amount)
  base_table: refunds
  time_column: refund_time
  aliases: [退款额, 退款金额, 退货金额]
  caveats:
    - 按 refund_time 归期，与 gmv 的归期字段不同，做同比环比时要注意
  owner: 数据团队

- name: refund_rate
  display_name: 退款率
  description: 退款金额 ÷ 成交总额
  expression: "{refund_amount} / NULLIF({gmv}, 0)"
  base_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
  aliases: [退款率, 退货率]
  caveats:
    - 分子按订单支付时间归期扣减，不是按退款发生时间
  owner: 数据团队

- name: pay_conversion_rate
  display_name: 支付转化率
  description: 已支付订单数 ÷ 全部下单数
  definition: COUNT(DISTINCT CASE WHEN orders.pay_time IS NOT NULL THEN orders.order_id END) * 1.0 / NULLIF(COUNT(DISTINCT orders.order_id), 0)
  base_table: orders
  time_column: create_time
  aliases: [支付转化率, 转化率, 成交转化]
  caveats:
    - 这个指标按 create_time 归期，和成交类指标的归期字段不同
  owner: 数据团队

- name: new_users
  display_name: 新增用户数
  description: 统计期内注册的用户数
  definition: COUNT(DISTINCT users.user_id)
  base_table: users
  time_column: register_time
  aliases: [新增用户, 新客数, 注册用户数]
  caveats:
    - 按注册时间统计，与交易行为无关
  owner: 数据团队

- name: active_users
  display_name: 活跃用户数
  description: 统计期内产生过页面行为的用户数
  definition: COUNT(DISTINCT page_events.user_id)
  base_table: page_events
  time_column: event_time
  aliases: [活跃用户, DAU, 日活, 月活]
  caveats:
    - 这里定义的是"有埋点行为"的用户，不等于有下单的用户
  owner: 数据团队

- name: refund_count
  display_name: 退款笔数
  description: 统计期内发生的退款笔数
  definition: COUNT(*)
  base_table: refunds
  time_column: refund_time
  aliases: [退款笔数, 退款单数, 退了多少笔, 退款数量]
  caveats:
    - 按 refund_time 归期。与"退款金额"是两个不同的指标，不要混用
  owner: 数据团队

- name: vip_gmv
  display_name: VIP 成交额
  description: 统计期内付费会员贡献的成交金额
  # 定义里引用了 users 的列，编译器会自动把 users join 进来
  definition: SUM(CASE WHEN users.is_vip THEN orders.amount ELSE 0 END)
  base_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
    - orders.pay_time IS NOT NULL
  aliases: [VIP成交额, 会员成交额, 付费会员成交额, VIP销售额, 会员贡献]
  caveats:
    - 需要关联 users 判断 is_vip，这个 join 由编译器从定义里推导
  owner: 数据团队

- name: vip_gmv_share
  display_name: VIP 成交额占比
  description: VIP 成交额 ÷ 成交总额
  expression: "{vip_gmv} / NULLIF({gmv}, 0)"
  base_table: orders
  time_column: pay_time
  filters:
    - orders.status IN ('paid', 'refunded')
  aliases: [VIP占比, 会员成交占比, VIP贡献占比, 会员成交额占比]
  caveats:
    - 分子分母都按订单支付时间归期，口径一致
  owner: 数据团队
